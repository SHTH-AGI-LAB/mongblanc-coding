<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블록핏 게임🕹️</title>
  <link rel="stylesheet" href="../style/style-blue.css">
</head>
<body>
  <header>
    <h1>안녕하세요, 저는 개발자 서아입니다!</h1>
  </header>

  <main>
    <img src="images/my-avatar.svg" alt="블록핏 대표 이미지" class="profile">
    <h2>게임 정보</h2>
    <ul>
      <li>사용방법: 테트리스와 유사함</li>
      <li>난이도: 하</li>
      <li>점수: 5단계</li>
    </ul>

    <h2>개발이유</h2>
    <p>
      코딩을 배워보고 싶어서
    </p>
  </main>

  <footer>
    <p>© 2025 개발자 서아 홈페이지</p>
  </footer>
</body>
</html>
<button id="bgBtn">배경 바꾸기</button>

<script>
  const colors = ["#ffe4e1", "#e0f7fa", "#fff9c4", "#e8f5e9", "#ede7f6"];
  document.getElementById("bgBtn").addEventListener("click", () => {
    const random = Math.floor(Math.random() * colors.length);
    document.body.style.backgroundColor = colors[random];
  });
</script>
